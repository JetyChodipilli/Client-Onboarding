spring:
  application:
    name: client-onboarding-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/client_onboarding?currentSchema=app}
    username: ${DATABASE_USERNAME:client_onboarding}
    password: ${DATABASE_PASSWORD:local-development-only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:1}
      connection-timeout: 5000
      validation-timeout: 2000
  flyway:
    enabled: true
    create-schemas: true
    schemas: app
    default-schema: app
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  paths-to-match: /api/v1/**,/health/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.brainserve.clientonboarding: INFO

app:
  assets:
    enabled: ${ASSET_STORAGE_ENABLED:false}
    endpoint: ${ASSET_STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${ASSET_STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${ASSET_STORAGE_REGION:us-east-1}
    bucket: ${ASSET_STORAGE_BUCKET:onboarding-assets}
    access-key: ${ASSET_STORAGE_ACCESS_KEY:}
    secret-key: ${ASSET_STORAGE_SECRET_KEY:}
    scanner-host: ${ASSET_SCANNER_HOST:localhost}
    scanner-port: ${ASSET_SCANNER_PORT:3310}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    public-app-url: ${PUBLIC_APP_URL:http://localhost:3000}
    session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
    session-duration: ${SESSION_DURATION:8h}
    session-idle-timeout: ${SESSION_IDLE_TIMEOUT:30m}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-lock-duration: ${LOGIN_LOCK_DURATION:15m}
    token-duration: ${SECURITY_TOKEN_DURATION:30m}
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY:}
    mail-from: ${SECURITY_MAIL_FROM:no-reply@localhost}
    smtp-host: ${SMTP_HOST:localhost}
    smtp-port: ${SMTP_PORT:1025}
    smtp-username: ${SMTP_USERNAME:}
    smtp-password: ${SMTP_PASSWORD:}
    smtp-starttls: ${SMTP_STARTTLS:false}
    smtp-auth: ${SMTP_AUTH:false}
    bootstrap:
      enabled: ${APP_BOOTSTRAP_ENABLED:false}
      organization-name: ${APP_BOOTSTRAP_ORGANIZATION_NAME:}
      organization-slug: ${APP_BOOTSTRAP_ORGANIZATION_SLUG:}
      admin-name: ${APP_BOOTSTRAP_ADMIN_NAME:}
      admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
