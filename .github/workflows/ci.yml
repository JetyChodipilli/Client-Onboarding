name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile and test
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint, typecheck, unit test and build
        working-directory: frontend
        run: npm run check

  browser:
    name: Browser regression
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: client_onboarding
          POSTGRES_USER: client_onboarding
          POSTGRES_PASSWORD: browser-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U client_onboarding -d client_onboarding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start Phase 4 backend
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/client_onboarding?currentSchema=app
          DATABASE_USERNAME: client_onboarding
          DATABASE_PASSWORD: browser-test-only
          MFA_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          SESSION_COOKIE_SECURE: "false"
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
          PUBLIC_APP_URL: http://127.0.0.1:3000
          APP_BOOTSTRAP_ENABLED: "true"
          APP_BOOTSTRAP_ORGANIZATION_NAME: E2E Agency
          APP_BOOTSTRAP_ORGANIZATION_SLUG: e2e-agency
          APP_BOOTSTRAP_ADMIN_NAME: E2E Admin
          APP_BOOTSTRAP_ADMIN_EMAIL: e2e-admin@example.test
          APP_BOOTSTRAP_ADMIN_PASSWORD: CorrectHorse7Battery
        run: |
          ./mvnw -B -ntp -DskipTests spring-boot:run \
            > /tmp/client-onboarding-backend.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/health/ready && exit 0
            sleep 2
          done
          tail -200 /tmp/client-onboarding-backend.log
          exit 1
      - name: Run Playwright
        working-directory: frontend
        env:
          LIVE_BACKEND: "1"
        run: npm run test:e2e

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
