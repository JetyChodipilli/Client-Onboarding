name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile and test
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint, typecheck, unit test and build
        working-directory: frontend
        run: npm run check

  browser:
    name: Browser regression
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start Phase 3 backend
        working-directory: backend
        run: |
          ./mvnw -B -ntp -Dspring-boot.run.useTestClasspath=true \
            -Dspring-boot.run.profiles=test \
            -Dspring-boot.run.arguments="--server.port=8080 --app.security.bootstrap.enabled=true --app.security.bootstrap.organization-name=E2E_Agency --app.security.bootstrap.organization-slug=e2e-agency --app.security.bootstrap.admin-name=E2E_Admin --app.security.bootstrap.admin-email=e2e-admin@example.test --app.security.bootstrap.admin-password=CorrectHorse7Battery" \
            spring-boot:run > /tmp/client-onboarding-backend.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/health/ready && exit 0
            sleep 2
          done
          tail -200 /tmp/client-onboarding-backend.log
          exit 1
      - name: Run Playwright
        working-directory: frontend
        env:
          LIVE_BACKEND: "1"
        run: npm run test:e2e

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
