openapi: 3.1.0
info:
  title: Client Onboarding Platform API
  version: 0.6.0-phase-5
  description: >-
    Identity, tenant-scoped client/project core, workflow engine, invitations, client portal and versioned forms.
    Invalid URL parameters return 400 VALIDATION_FAILED. Authenticated unknown routes return
    404 RESOURCE_NOT_FOUND; unsupported methods return 405 METHOD_NOT_ALLOWED and unsupported
    request media types return 415 UNSUPPORTED_MEDIA_TYPE using the standard error envelope.
servers:
  - url: http://localhost:8080
tags:
  - name: Authentication
  - name: Organizations
  - name: RBAC
  - name: Audit
  - name: Clients
  - name: Services
  - name: Projects
  - name: Workflows
  - name: Onboarding
  - name: Client Portal
  - name: Forms
  - name: Foundation
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      summary: Initialize the cookie-to-header CSRF token
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate an internal user in one organization
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '202': { description: MFA verification or enrollment is required }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/mfa/complete:
    post:
      tags: [Authentication]
      summary: Complete TOTP or one-time recovery-code verification
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string, maxLength: 200 }
                code: { type: string, maxLength: 40 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Consume the current session once and issue a rotated session token
      description: Concurrent rotation, revoked sessions, expiry and stale credential versions return 401.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/forgot-password:
    post:
      tags: [Authentication]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountLookupRequest' }
      responses:
        '202': { description: Generic accepted response }
  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/auth/verify-email:
    post:
      tags: [Authentication]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/auth/accept-invitation:
    post:
      tags: [Authentication]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/auth/email-verification/resend:
    post:
      tags: [Authentication]
      summary: Resend an eligible internal organization invitation without account disclosure
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountLookupRequest' }
      responses:
        '202': { description: Generic accepted response }
  /api/v1/organizations/{organizationId}:
    parameters:
      - name: organizationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Organizations]
      security: [{ cookieAuth: [] }]
      summary: Read the authenticated tenant only
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Organizations]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version]
              properties:
                name: { type: string, maxLength: 160 }
                version: { type: integer, format: int64, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/permissions:
    get:
      tags: [RBAC]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/roles:
    get:
      tags: [RBAC]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [RBAC]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleRequest' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /api/v1/roles/{roleId}:
    patch:
      tags: [RBAC]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/roles/{roleId}/archive:
    post:
      tags: [RBAC]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/organization-members:
    get:
      tags: [Organizations]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
    post:
      tags: [Organizations]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, roleId]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                displayName: { type: string, maxLength: 160 }
                roleId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /api/v1/organization-members/{membershipId}:
    patch:
      tags: [Organizations]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId, status, version]
              properties:
                roleId: { type: string, format: uuid }
                status: { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
                version: { type: integer, format: int64, minimum: 0 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /api/v1/clients:
    get:
      tags: [Clients]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string, enum: [PROSPECT, ACTIVE, INACTIVE, ARCHIVED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Clients]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/clients/{clientId}:
    parameters: [{ name: clientId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clients]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Clients]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/clients/{clientId}/contacts:
    parameters: [{ name: clientId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Clients]
      security: [{ cookieAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Clients]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/clients/{clientId}/archive:
    post:
      tags: [Clients]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/client-contacts/{contactId}:
    patch:
      tags: [Clients]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: contactId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/client-contacts/{contactId}/archive:
    post:
      tags: [Clients]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: contactId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/services:
    get:
      tags: [Services]
      security: [{ cookieAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Services]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/services/{serviceId}:
    parameters: [{ name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Services]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Services]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/services/{serviceId}/archive:
    post:
      tags: [Services]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/projects:
    get:
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: clientId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/projects/{projectId}:
    parameters: [{ name: projectId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{projectId}/{action}:
    post:
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [hold, resume, complete, cancel, archive] } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{projectId}/members:
    parameters: [{ name: projectId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [membershipId, assignmentRole]
              properties:
                membershipId: { type: string, format: uuid }
                assignmentRole: { type: string, minLength: 1, maxLength: 80 }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/projects/{projectId}/members/{memberId}:
    delete:
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/projects/{projectId}/activities:
    get:
      tags: [Projects]
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /api/v1/workflow-templates:
    get:
      tags: [Workflows]
      security: [{ cookieAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Workflows]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowTemplateRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/workflow-templates/{templateId}:
    get:
      tags: [Workflows]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: templateId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workflow-templates/{templateId}/archive:
    post:
      tags: [Workflows]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/workflow-templates/{templateId}/versions:
    parameters: [{ name: templateId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Workflows]
      security: [{ cookieAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
    post:
      tags: [Workflows]
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses: { '201': { $ref: '#/components/responses/Success' } }
  /api/v1/workflow-template-versions/{versionId}/steps:
    put:
      tags: [Workflows]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowStepsRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/workflow-template-versions/{versionId}:
    get:
      tags: [Workflows]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workflow-template-versions/{versionId}/publish:
    post:
      tags: [Workflows]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{projectId}/onboarding:
    parameters: [{ name: projectId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Onboarding]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [Onboarding]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 8, maxLength: 120 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingStartRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/onboardings/{onboardingId}:
    get:
      tags: [Onboarding]
      security: [{ cookieAuth: [] }]
      parameters: [{ name: onboardingId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/onboarding-steps/{stepId}/transition:
    post:
      tags: [Onboarding]
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
