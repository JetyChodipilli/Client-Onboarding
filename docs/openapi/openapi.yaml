  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
  responses:
    Success:
      description: Standard success envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    LoginRequest:
      type: object
      required: [email, password, organizationSlug]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 200 }
        organizationSlug: { type: string, maxLength: 80 }
    AccountLookupRequest:
      type: object
      required: [email, organizationSlug]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        organizationSlug: { type: string, maxLength: 80 }
    TokenPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 200 }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 200 }
    ClientInviteRequest:
      type: object
      additionalProperties: false
      required: [contactId, role]
      properties:
        contactId: { type: string, format: uuid }
        role: { type: string, enum: [ADMIN, MEMBER] }
    VersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
    RoleRequest:
      type: object
      required: [name, permissions, version]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 240 }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string, maxLength: 80 }
        version: { type: integer, format: int64, minimum: 0 }
    ClientRequest:
      type: object
      additionalProperties: false
      required: [name, status, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        legalName: { type: string, maxLength: 200 }
        status: { type: string, enum: [PROSPECT, ACTIVE, INACTIVE] }
        website: { type: string, maxLength: 500 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 50 }
        notes: { type: string, maxLength: 2000 }
        version: { type: integer, format: int64, minimum: 0 }
    ContactRequest:
      type: object
      additionalProperties: false
      required: [name, email, primary, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 50 }
        jobTitle: { type: string, maxLength: 120 }
        primary: { type: boolean }
        version: { type: integer, format: int64, minimum: 0 }
    ServiceRequest:
      type: object
      additionalProperties: false
      required: [code, name, status, version]
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, format: int64, minimum: 0 }
    ProjectRequest:
      type: object
      additionalProperties: false
      required: [clientId, serviceId, name, version]
      properties:
        clientId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 2000 }
        valueMinor: { type: integer, format: int64, minimum: 0 }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        targetStartDate: { type: string, format: date }
        version: { type: integer, format: int64, minimum: 0 }
    WorkflowTemplateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 1000 }
        serviceId: { type: string, format: uuid }
    WorkflowStepsRequest:
      type: object
      additionalProperties: false
      required: [version, steps]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        steps:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [stepKey, name, stepType, displayOrder, required, blocking, clientVisible, requiresReview, dependencyMode, allowSkip, allowReopen]
            properties:
              id: { type: string, format: uuid }
              stepKey: { type: string, maxLength: 80 }
              name: { type: string, maxLength: 180 }
              stepType: { type: string }
              displayOrder: { type: integer, minimum: 0 }
              required: { type: boolean }
              blocking: { type: boolean }
              clientVisible: { type: boolean }
              requiresReview: { type: boolean }
              dependencyMode: { type: string, enum: [NONE, ALL, ANY] }
              condition:
                type: object
                additionalProperties: false
                required: [field, operator, value]
                properties:
                  field:
                    type: string
                    enum: [SERVICE_CODE, PROJECT_VALUE_MINOR, CLIENT_STATUS, CURRENCY_CODE]
                  operator:
                    type: string
                    enum: [EQUALS, NOT_EQUALS, GREATER_THAN, GREATER_THAN_OR_EQUAL, IN]
                  value: { type: string, minLength: 1, maxLength: 300 }
              assignedRole: { type: string, maxLength: 100 }
              dueAfterHours: { type: integer, minimum: 0, maximum: 87600 }
              reminderPolicyId: { type: string, format: uuid }
              allowSkip: { type: boolean }
              allowReopen: { type: boolean }
              configuration: { type: object, additionalProperties: true }
              dependencyStepIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
    OnboardingStartRequest:
      type: object
      additionalProperties: false
      required: [templateVersionId, projectVersion]
      properties:
        templateVersionId: { type: string, format: uuid }
        projectVersion: { type: integer, format: int64, minimum: 0 }
    StepTransitionRequest:
      type: object
      additionalProperties: false
      required: [targetStatus, version]
      properties:
        targetStatus:
          type: string
          enum: [LOCKED, AVAILABLE, IN_PROGRESS, SUBMITTED, UNDER_REVIEW, NEEDS_REVISION, COMPLETED, SKIPPED, FAILED, CANCELLED]
        version: { type: integer, format: int64, minimum: 0 }
    SuccessEnvelope:
      type: object
      required: [success, data, meta, requestId]
      properties:
        success: { const: true }
        data: {}
        meta: { type: object, additionalProperties: true }
        requestId: { type: string, format: uuid }
    ErrorEnvelope:
      type: object
      required: [success, error, requestId]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message, fieldErrors]
          properties:
            code: { type: string }
            message: { type: string }
            fieldErrors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
        requestId: { type: string, format: uuid }

    FormTemplateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 1000
    FormSourceRequest:
      type: object
      additionalProperties: false
      properties:
        sourceVersionId:
          type: string
          format: uuid
    FormField:
      type: object
      additionalProperties: false
      required:
      - key
      - label
      - type
      - required
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,59}$
        label:
          type: string
          minLength: 1
          maxLength: 180
        type:
          type: string
          enum:
          - TEXT
          - TEXTAREA
          - NUMBER
          - EMAIL
          - URL
          - DATE
          - DROPDOWN
          - RADIO
          - CHECKBOX
          - MULTI_SELECT
          - BOOLEAN
        required:
          type: boolean
        helpText:
          type: string
          maxLength: 1000
        options:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
        maxLength:
          type: integer
          minimum: 1
          maximum: 10000
        min:
          type: number
        max:
          type: number
        condition:
          type: object
          additionalProperties: false
          required:
          - fieldKey
          - operator
          - value
          properties:
            fieldKey:
              type: string
            operator:
              type: string
              enum:
              - EQUALS
              - NOT_EQUALS
              - CONTAINS
            value:
              type: string
              maxLength: 200
    FormFieldsRequest:
      type: object
      additionalProperties: false
      required:
      - version
      - fields
      properties:
        version:
          type: integer
          minimum: 0
        fields:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/FormField'
    FormAnswersRequest:
      type: object
      additionalProperties: false
      required:
      - version
      - answers
      properties:
        version:
          type: integer
          minimum: 0
        answers:
          type: object
          maxProperties: 100
          additionalProperties:
            oneOf:
            - type: string
              maxLength: 10000
            - type: number
            - type: boolean
            - type: array
              maxItems: 50
              uniqueItems: true
              items:
                type: string
                maxLength: 200
    FormReviewRequest:
      type: object
      additionalProperties: false
      required:
      - version
      - decision
      properties:
        version:
          type: integer
          minimum: 0
        decision:
          type: string
          enum:
          - UNDER_REVIEW
          - NEEDS_REVISION
          - APPROVED
        note:
          type: string
          maxLength: 2000
    FormExceptionRequest:
      type: object
      additionalProperties: false
      required:
      - version
      - note
      properties:
        version:
          type: integer
          minimum: 0
        note:
          type: string
          minLength: 1
          maxLength: 2000
